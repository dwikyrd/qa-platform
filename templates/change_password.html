<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>🔑 Ubah Password</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: #f0f2f5;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Segoe UI", system-ui, sans-serif;
        margin: 0;
        padding: 20px;
      }
      .password-card {
        background: white;
        border-radius: 12px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        padding: 40px;
        max-width: 480px;
        width: 100%;
      }
      .password-card h3 {
        font-weight: 700;
        margin-bottom: 8px;
      }
      .form-control:focus {
        border-color: #0d6efd;
        box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.25);
      }
      .btn-skip:hover {
        background: #f8f9fa;
      }
    </style>
  </head>
  <body>
    <div class="password-card">
      <h3>🔑 Ubah Password</h3>
      <p class="text-muted mb-4">
        Akun: <strong>{{ user.username }}</strong> ({{ user.role | capitalize
        }})
      </p>

      {% with messages = get_flashed_messages(with_categories=true) %} {% if
      messages %} {% for category, message in messages %}
      <div class="alert alert-{{ category }} py-2 small">{{ message }}</div>
      {% endfor %} {% endif %} {% endwith %}

      <form method="POST" action="/change-password">
        <div class="mb-3">
          <label class="form-label fw-bold small">Password Lama</label>
          <input
            type="password"
            name="old_password"
            class="form-control"
            required
            autocomplete="current-password"
          />
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold small"
            >Password Baru (min. 4 karakter)</label
          >
          <input
            type="password"
            name="new_password"
            class="form-control"
            required
            minlength="4"
            autocomplete="new-password"
          />
        </div>
        <div class="mb-4">
          <label class="form-label fw-bold small"
            >Konfirmasi Password Baru</label
          >
          <input
            type="password"
            name="confirm_password"
            class="form-control"
            required
            minlength="4"
            autocomplete="new-password"
          />
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary flex-grow-1">
            💾 Simpan Password Baru
          </button>
          <a
            href="/skip-change-password"
            class="btn btn-outline-secondary btn-skip"
            >️ Lewati</a
          >
        </div>
      </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
